# Example Nginx site config for Rare Candy Reserve
server {
  listen 80;
  server_name yourdomain.example;
  root C:/Users/Chris/.copilot/copilot-worktrees/Ashrepo/kingkoopabro-stack-solid-potato/public;

  location / {
    try_files $uri $uri/ =404;
  }

  location /music/ {
    # Serve static music files; add rate limiting if needed
    try_files $uri =404;
  }

  # Optionally proxy /api/ to a backend that creates Stripe Checkout sessions
  location /api/ {
    proxy_pass http://127.0.0.1:5000/; # adjust if you run a backend
  }
}
