<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Projects - Rare Candy Reserve</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<header><img class="banner" src="/images/a75ab98a-c055-41bf-a08e-fecf8aa1abee-Rare_Candy_Reserve_LOGO.png" alt="Rare Candy Reserve"><div class="header-row"><nav><a href="/">Home</a><a href="/products.html">Shop</a><a href="/music.html">Music</a></nav></div></header>
<main class="container"><section class="card"><h1>Send Us Your Project</h1><p>Describe your idea and attach reference photos, sketches, or design files. We will review the request and reply with options and a quote.</p>
<form action="https://formspree.io/f/your-form-id" method="POST" enctype="multipart/form-data">
<label>Your name <input type="text" name="name" required></label><br>
<label>Email <input type="email" name="email" required></label><br>
<label>Project type <select name="project_type"><option>Custom 3D print</option><option>Plant or mycology print</option><option>Collectible display</option><option>Other</option></select></label><br>
<label>Project description<br><textarea name="description" rows="8" required></textarea></label><br>
<label>Reference images or files <input type="file" name="references" accept="image/*,.stl,.3mf,.obj,.pdf" multiple></label><br>
<button type="submit">Send Project Request</button>
</form></section></main>
</body></html>
