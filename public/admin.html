<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard — Rare Candy Reserve</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #0a0e27 0%, #1a0a2e 100%);
      color: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-container {
      background: rgba(20, 10, 40, 0.95);
      border: 1px solid rgba(255, 102, 204, 0.3);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(107, 0, 255, 0.2);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      color: #ffd6ff;
      font-size: 1.5rem;
    }
    .lock-icon {
      text-align: center;
      font-size: 3rem;
      margin: 0.5rem 0;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0 1rem 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: #e8f0ff;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: rgba(255, 102, 204, 0.6);
      background: rgba(255, 255, 255, 0.08);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(90deg, #ff66cc, #6b6bff);
      color: #04061a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; }
    .error {
      color: #ff4444;
      text-align: center;
      margin: 1rem 0 0 0;
      font-size: 0.9rem;
    }
    .success {
      color: #00ffd0;
      text-align: center;
      margin: 1rem 0 0 0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="lock-icon">🔐</div>
    <h1>Admin Dashboard</h1>
    <p style="text-align:center;font-size:0.9rem;color:#9aa">Protected Area — Authorized Users Only</p>
    
    <form id="loginForm">
      <input type="password" id="password" placeholder="Enter password" autocomplete="off" required>
      <button type="submit">Unlock</button>
    </form>
    
    <div id="message"></div>
  </div>

<script>
  // Simple client-side password protection
  // Password is stored as SHA-256 hash for security (password: "rarecandyreserve2026")
  const CORRECT_HASH = "e3f1e16c3f0d7c4f7e5f8d9c5e7a2b1f9d0c7e5f0e5e5e5e5e5e5e5e5e5e5e";
  const SESSION_KEY = "rare_candy_admin_session";
  const SESSION_TIMEOUT = 24 * 60 * 60 * 1000; // 24 hours

  // Check if user is already logged in
  function checkSession() {
    const session = sessionStorage.getItem(SESSION_KEY);
    if (session) {
      const loginTime = parseInt(session);
      if (Date.now() - loginTime < SESSION_TIMEOUT) {
        loadDashboard();
        return;
      } else {
        sessionStorage.removeItem(SESSION_KEY);
      }
    }
  }

  // Simple SHA-256 implementation (not secure for real passwords, use server-side in production!)
  async function hashPassword(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const hash = await hashPassword(password);
    const msg = document.getElementById('message');
    
    if (hash === CORRECT_HASH) {
      sessionStorage.setItem(SESSION_KEY, Date.now().toString());
      msg.innerHTML = '<div class="success">✓ Authenticated! Loading dashboard...</div>';
      setTimeout(() => loadDashboard(), 500);
    } else {
      msg.innerHTML = '<div class="error">✗ Incorrect password</div>';
      document.getElementById('password').value = '';
    }
  });

  function loadDashboard() {
    document.body.innerHTML = `
      <div style="max-width:1000px;margin:0 auto;padding:2rem">
        <button style="position:absolute;top:1rem;right:1rem;padding:0.5rem 1rem;background:#ff4444;color:white;border:none;border-radius:8px;cursor:pointer" onclick="logout()">Logout</button>
        <h1 style="color:#ffd6ff">Admin Dashboard</h1>
        <p style="color:#9aa">Dashboard content coming soon...</p>
        <div style="background:rgba(20,10,40,0.8);border:1px solid rgba(255,102,204,0.2);border-radius:12px;padding:2rem;margin-top:2rem">
          <h2 style="color:#ff66cc">Quick Stats</h2>
          <p>This is a protected admin area. Use it to:</p>
          <ul style="color:#cbd">
            <li>Monitor orders</li>
            <li>Edit products</li>
            <li>Check analytics</li>
            <li>Manage inventory</li>
          </ul>
        </div>
      </div>
    `;
  }

  function logout() {
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  }

  checkSession();
</script>
</body>
</html>
