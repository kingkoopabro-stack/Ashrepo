<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rare Candy Reserve</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <img src="/images/a75ab98a-c055-41bf-a08e-fecf8aa1abee-Rare_Candy_Reserve_LOGO.png" alt="banner" style="width:100%;height:160px;object-fit:cover">
    <div style="display:flex;align-items:center;padding:0.6rem 1rem;">
      <img src="/images/a75ab98a-c055-41bf-a08e-fecf8aa1abee-Rare_Candy_Reserve_LOGO.png" style="height:64px;border-radius:8px">
      <nav style="margin-left:auto"> <a href="/">Home</a> <a href="/products.html">Products</a> <a href="/music.html">Music</a> <a href="/submit.html">Submit</a> </nav>
    </div>
  </header>
  <main class="container">
    <section class="card player">
      <button id="playBtn">▶</button>
      <div id="trackInfo">Loading...</div>
      <label>Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <div style="margin-top:10px;text-align:center">Follow A Steady Heart! <a href="https://open.spotify.com/artist/5Yu8YngzEdVTot78vdFgnB?si=Mqjo7Sk_QTSaHr73mWOELQ" target="_blank">Spotify</a> • <a href="https://www.pandora.com/artist/a-steady-heart/ARpnXxfJ9zZrbK6" target="_blank">Pandora</a> • <a href="#" target="_blank">Facebook</a></div>
      <p style="text-align:center;color:#cbd;">He is creative in quite a few ways when he is not building something amazing; writing and playing music to bring a smile or tear to the listener.</p>
    </section>
  </main>
<script>
(async function(){
  try{
    const resp = await fetch('/music/playlist.json');
    const list = await resp.json();
    if(!list || list.length===0){ document.getElementById('trackInfo').textContent='No tracks found'; return }
    let idx=0, audio=new Audio(list[0].file);
    const info = document.getElementById('trackInfo');
    const playBtn = document.getElementById('playBtn');
    const vol = document.getElementById('vol');
    audio.volume = parseFloat(vol.value||0.8);
    info.textContent = list[0].title;
    playBtn.addEventListener('click',()=>{ if(audio.paused) { audio.play(); playBtn.textContent='⏸' } else { audio.pause(); playBtn.textContent='▶' } });
    vol.addEventListener('input',()=>{ audio.volume = parseFloat(vol.value) });
    audio.addEventListener('ended',()=>{ idx=(idx+1)%list.length; audio.src=list[idx].file; info.textContent=list[idx].title; audio.play() });
  }catch(e){ console.error(e); document.getElementById('trackInfo').textContent='Player error' }
})();
</script>
</body>
</html>
