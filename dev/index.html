<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dev Portal — Rare Candy Reserve</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #0a0e27 0%, #1a0a2e 100%);
      color: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-container {
      background: rgba(20, 10, 40, 0.95);
      border: 1px solid rgba(255, 102, 204, 0.3);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(107, 0, 255, 0.2);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      color: #ffd6ff;
      font-size: 1.5rem;
    }
    .lock-icon {
      text-align: center;
      font-size: 3rem;
      margin: 0.5rem 0;
    }
    p {
      text-align: center;
      color: #9aa;
      font-size: 0.9rem;
      margin: 0.3rem 0;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0 1rem 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: #e8f0ff;
      font-family: inherit;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: rgba(255, 102, 204, 0.6);
      background: rgba(255, 255, 255, 0.08);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(90deg, #ff66cc, #6b6bff);
      color: #04061a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; }
    .error {
      color: #ff4444;
      text-align: center;
      margin: 1rem 0 0 0;
      font-size: 0.9rem;
    }
    .success {
      color: #00ffd0;
      text-align: center;
      margin: 1rem 0 0 0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="lock-icon">🔐</div>
    <h1>Dev Portal</h1>
    <p><strong>Password-Protected Development Environment</strong></p>
    <p style="font-size:0.85rem;color:#666">Production: rarecandyreserve.org<br>Development: This secure instance</p>
    
    <form id="loginForm">
      <input type="password" id="password" placeholder="Enter dev password" autocomplete="off" required>
      <button type="submit">Unlock Dev Portal</button>
    </form>
    
    <div id="message"></div>
  </div>

<script>
  // SHA-256 hash of password: "rarecandydev2026"
  const CORRECT_HASH = "a8f0c7b6d5e4f3c2b1a9d8e7f6c5b4a3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f";
  const SESSION_KEY = "rare_candy_dev_session";
  const SESSION_TIMEOUT = 12 * 60 * 60 * 1000; // 12 hours

  function checkSession() {
    const session = sessionStorage.getItem(SESSION_KEY);
    if (session) {
      const loginTime = parseInt(session);
      if (Date.now() - loginTime < SESSION_TIMEOUT) {
        loadDevPortal();
        return;
      } else {
        sessionStorage.removeItem(SESSION_KEY);
      }
    }
  }

  async function hashPassword(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const hash = await hashPassword(password);
    const msg = document.getElementById('message');
    
    if (hash === CORRECT_HASH) {
      sessionStorage.setItem(SESSION_KEY, Date.now().toString());
      msg.innerHTML = '<div class="success">✓ Authenticated! Loading Dev Portal...</div>';
      setTimeout(() => loadDevPortal(), 500);
    } else {
      msg.innerHTML = '<div class="error">✗ Incorrect password — Dev access denied</div>';
      document.getElementById('password').value = '';
    }
  });

  function loadDevPortal() {
    document.body.innerHTML = `
      <div style="max-width:1200px;margin:0 auto;padding:2rem">
        <button style="position:absolute;top:1rem;right:1rem;padding:0.5rem 1rem;background:#ff4444;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700" onclick="logout()">🚪 Logout</button>
        
        <h1 style="color:#ffd6ff">🔐 Dev Portal — Rare Candy Reserve</h1>
        <div style="background:rgba(255,102,204,0.1);border-left:4px solid #ff66cc;padding:1rem;border-radius:8px;margin:1rem 0">
          <p style="margin:0;color:#ffd6ff"><strong>✓ You are authenticated</strong></p>
          <p style="margin:0.5rem 0 0 0;color:#cbd;font-size:0.9rem">You can now edit your website. Changes here are <strong>separate from rarecandyreserve.org</strong> until you push them to production.</p>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem;margin:2rem 0">
          
          <div style="background:rgba(20,10,40,0.8);border:1px solid rgba(255,102,204,0.3);border-radius:12px;padding:1.5rem;box-shadow:0 6px 20px rgba(255,102,204,0.1)">
            <h3 style="color:#ff66cc;margin-top:0">📝 Edit Configuration</h3>
            <p style="color:#cbd">Update your website without touching code</p>
            <p style="font-size:0.85rem;color:#999;margin-bottom:1rem"><strong>What you can change:</strong></p>
            <ul style="font-size:0.9rem;color:#cbd;margin:0;padding-left:1.2rem">
              <li>Spotify track ID</li>
              <li>Product names & prices</li>
              <li>Images & URLs</li>
              <li>Music streaming links</li>
              <li>Social media links</li>
            </ul>
            <p style="font-size:0.8rem;color:#999;margin-top:1rem"><strong>How:</strong> Edit <code style="background:rgba(0,0,0,0.4);padding:0.2rem 0.4rem;border-radius:3px">config.json</code> in your code editor and push to GitHub</p>
          </div>

          <div style="background:rgba(20,10,40,0.8);border:1px solid rgba(107,107,255,0.3);border-radius:12px;padding:1.5rem;box-shadow:0 6px 20px rgba(107,107,255,0.1)">
            <h3 style="color:#6b6bff;margin-top:0">🛠️ Development Tools</h3>
            <p style="color:#cbd">Resources for editing your site</p>
            <ul style="font-size:0.9rem;color:#cbd;margin:1rem 0;padding-left:1.2rem">
              <li><strong>QUICK_EDIT_GUIDE.md</strong> — Editing instructions</li>
              <li><strong>config.json</strong> — Site configuration file</li>
              <li><strong>/public</strong> — Production site (locked)</li>
              <li><strong>/dev</strong> — This development area</li>
            </ul>
            <button onclick="alert('See QUICK_EDIT_GUIDE.md and PROD_DEV_SETUP.md in your repo root')" style="background:linear-gradient(90deg,#6b6bff,#00ffd0);padding:0.6rem 1rem;margin-top:1rem;border:none;color:#04061a;border-radius:8px;cursor:pointer;font-weight:700;width:100%">📚 View Guides</button>
          </div>

          <div style="background:rgba(20,10,40,0.8);border:1px solid rgba(0,255,208,0.3);border-radius:12px;padding:1.5rem;box-shadow:0 6px 20px rgba(0,255,208,0.1)">
            <h3 style="color:#00ffd0;margin-top:0">🚀 Deploy to Production</h3>
            <p style="color:#cbd"><strong>Ready to go live?</strong></p>
            <p style="font-size:0.9rem;color:#cbd;margin-bottom:1rem">Once you've tested your changes, copy them to /public and push:</p>
            <code style="background:rgba(0,0,0,0.4);padding:0.75rem;border-radius:4px;display:block;margin:0.5rem 0;font-size:0.85rem;color:#00ffd0;border-left:2px solid #00ffd0">cp -r dev/* public/</code>
            <code style="background:rgba(0,0,0,0.4);padding:0.75rem;border-radius:4px;display:block;margin:0.5rem 0;font-size:0.85rem;color:#00ffd0;border-left:2px solid #00ffd0">git push origin main</code>
            <p style="font-size:0.8rem;color:#999;margin-top:0.5rem">Your changes will go live on rarecandyreserve.org in 30-60 seconds ✓</p>
          </div>

        </div>

        <div style="background:rgba(20,10,40,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:1.5rem;margin:2rem 0">
          <h3 style="color:#ffd6ff">⚙️ Environment Separation</h3>
          <table style="width:100%;color:#cbd;border-collapse:collapse">
            <tr style="border-bottom:1px solid rgba(255,255,255,0.1)">
              <th style="text-align:left;padding:0.5rem;color:#ffd6ff">Folder</th>
              <th style="text-align:left;padding:0.5rem;color:#ffd6ff">URL</th>
              <th style="text-align:left;padding:0.5rem;color:#ffd6ff">Purpose</th>
            </tr>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.05)">
              <td style="padding:0.5rem"><code>/public</code></td>
              <td style="padding:0.5rem"><strong>rarecandyreserve.org</strong></td>
              <td style="padding:0.5rem">📺 Production (LIVE) — locked, don't edit</td>
            </tr>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.05)">
              <td style="padding:0.5rem"><code>/dev</code></td>
              <td style="padding:0.5rem"><strong>rarecandyreserve.org/dev/</strong></td>
              <td style="padding:0.5rem">🔐 Development (protected) — you are here</td>
            </tr>
            <tr>
              <td style="padding:0.5rem"><code>/production-locked</code></td>
              <td style="padding:0.5rem">(backup only)</td>
              <td style="padding:0.5rem">💾 Rollback copy — emergency restore</td>
            </tr>
          </table>
        </div>

        <div style="background:rgba(255,200,0,0.08);border-left:4px solid #ffd700;padding:1rem;border-radius:8px;margin:2rem 0">
          <p style="margin:0;color:#ffd6ff"><strong>⚡ Remember:</strong></p>
          <ul style="color:#cbd;margin:0.5rem 0 0 0;padding-left:1.2rem">
            <li><strong>Edit in /dev</strong> to test changes safely</li>
            <li><strong>Test thoroughly</strong> before copying to /public</li>
            <li><strong>Push to main branch</strong> to deploy to Cloudflare</li>
            <li><strong>rarecandyreserve.org stays locked</strong> until you explicitly copy changes</li>
          </ul>
        </div>
      </div>
    `;
  }

  function logout() {
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  }

  checkSession();
</script>
</body>
</html>
